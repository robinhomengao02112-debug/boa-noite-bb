name: Buds Control APK

on:
  push:
    paths:
      - 'redmi-buds-control/**'
      - '.github/workflows/buds-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: redmi-buds-control
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk BudsControl.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: BudsControl-apk
          path: redmi-buds-control/BudsControl.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buds-v1.0.${{ github.run_number }}
          name: Buds Control 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            APK do Buds Control (Redmi Buds 6 Lite e família Xiaomi/Redmi).
            Baixe **BudsControl.apk** no celular e instale (permita "instalar apps desconhecidos").
          files: redmi-buds-control/BudsControl.apk
